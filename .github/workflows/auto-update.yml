name: 🤖 Robô Auto-Curadoria
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install node-fetch cheerio
      - run: node scripts/updater.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Scraper] Top 10 Preservando Curadoria"
          branch: main